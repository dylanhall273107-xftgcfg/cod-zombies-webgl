<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="description" content="Zombie Bunker - A high-performance Call of Duty Zombies-style mobile WebGL shooter game." />
  <meta name="theme-color" content="#05070a" />
  <title>Zombie Bunker | Mobile WebGL Shooter</title>
  <style>
    :root {
      --bg: #05070a;
      --panel: rgba(17, 23, 30, 0.42);
      --panel-border: rgba(120, 170, 210, 0.25);
      --text: #edf7ff;
      --muted: #9ab7d0;
      --warning: #ffb347;
      --danger: #ff6767;
      --good: #7cf7b8;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at 50% 30%, rgba(26, 36, 44, 0.8), rgba(5, 7, 10, 0.9) 35%, rgba(0,0,0,1) 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: auto;
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      min-width: 170px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      box-shadow: 0 0 18px rgba(0,0,0,0.25);
      padding: 10px 12px 12px 12px;
      backdrop-filter: blur(2px);
    }

    .title {
      color: var(--warning);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      line-height: 1.5;
      white-space: nowrap;
      font-size: 14px;
      color: var(--text);
    }

    .stat .label {
      color: var(--muted);
    }

    .stat .value {
      font-weight: 700;
      text-shadow: 0 0 12px rgba(255,255,255,0.12);
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
      z-index: 16;
      pointer-events: none;
      opacity: 0.8;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.8);
      box-shadow: 0 0 8px rgba(255,255,255,0.18);
    }

    #crosshair::before {
      left: 50%;
      top: -3px;
      width: 2px;
      height: 26px;
      transform: translateX(-50%);
    }

    #crosshair::after {
      left: -3px;
      top: 50%;
      width: 26px;
      height: 2px;
      transform: translateY(-50%);
    }

    #muzzleFlash {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform: translate(-50%, -50%);
      z-index: 15;
      pointer-events: none;
      opacity: 0;
    }

    @keyframes flashBurst {
      0% {
        width: 18px;
        height: 22px;
        opacity: 1;
      }
      100% {
        width: 0;
        height: 0;
        opacity: 0;
      }
    }

    #muzzleFlash.burst {
      animation: flashBurst 0.08s ease-out;
      background: radial-gradient(circle, #ffff88 0%, #ffdd44 50%, #ff8844 100%);
      border-radius: 50%;
    }

    #touchOverlay {
      position: absolute;
      inset: 0;
      z-index: 25;
      pointer-events: none;
    }

    .touchZone {
      position: absolute;
      width: 50%;
      height: 100%;
      pointer-events: auto;
    }

    #leftZone {
      left: 0;
      bottom: 0;
    }

    #rightZone {
      right: 0;
      bottom: 0;
    }

    .joystick {
      position: absolute;
      left: 24px;
      bottom: 24px;
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background: rgba(150, 190, 255, 0.06);
      border: 2px solid rgba(120, 180, 255, 0.18);
      box-shadow: inset 0 0 15px rgba(100, 120, 180, 0.08);
    }

    .joystickKnob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: 54px;
      margin-left: -27px;
      margin-top: -27px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(170,220,255,0.9), rgba(90,130,190,0.62));
      box-shadow: 0 0 16px rgba(70,160,255,0.35);
      border: 1px solid rgba(255,255,255,0.22);
      transform: translate(0px, 0px);
      transition: transform 0.02s ease-out;
    }

    .action {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 0 20px rgba(0,0,0,0.18);
      pointer-events: auto;
      transition: all 0.08s ease;
    }

    #shootButton {
      right: 22px;
      bottom: 18px;
      width: 110px;
      height: 110px;
      background: rgba(255, 90, 70, 0.16);
      border-color: rgba(255, 120, 92, 0.45);
      box-shadow: 0 0 20px rgba(255,110,90,0.18);
      font-size: 13px;
      line-height: 1.2;
    }

    #reloadButton {
      right: 142px;
      bottom: 88px;
      width: 72px;
      height: 72px;
      background: rgba(112, 255, 148, 0.08);
      border-color: rgba(112, 255, 148, 0.38);
      font-size: 10px;
    }

    .action:active {
      transform: scale(0.94);
      filter: brightness(1.22);
    }

    #gameOver {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.78);
      pointer-events: auto;
      backdrop-filter: blur(4px);
    }

    #gameOver.show {
      display: flex;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .gameOverCard {
      text-align: center;
      padding: 26px 22px 20px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255, 120, 92, 0.28);
      background: rgba(35, 18, 18, 0.54);
      box-shadow: 0 0 28px rgba(255, 90, 70, 0.12);
      animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideUp {
      from {
        transform: translateY(40px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    #gameOverTitle {
      color: #ff8d7f;
      font-size: clamp(28px, 8vw, 52px);
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(255, 120, 92, 0.28);
    }

    #gameSummary {
      color: #ebf6ff;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 18px;
    }

    #restartPrompt {
      color: #81f7b8;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 768px) {
      .panel {
        top: 8px;
        left: 8px;
        min-width: 150px;
        padding: 8px 10px 10px 10px;
        font-size: 12px;
      }

      .stat {
        font-size: 13px;
      }

      #shootButton {
        right: 16px;
        bottom: 16px;
        width: 100px;
        height: 100px;
        font-size: 12px;
      }

      #reloadButton {
        right: 126px;
        bottom: 76px;
        width: 64px;
        height: 64px;
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="panel">
      <div class="title">Zombie Bunker</div>
      <div class="stat"><span class="label">Wave</span><span class="value" id="waveValue">1</span></div>
      <div class="stat"><span class="label">Health</span><span class="value" id="healthValue">100</span></div>
      <div class="stat"><span class="label">Ammo</span><span class="value" id="ammoValue">30 / 120</span></div>
      <div class="stat"><span class="label">Points</span><span class="value" id="pointsValue">0</span></div>
      <div class="stat"><span class="label">Zombies</span><span class="value" id="zombieValue">0</span></div>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="muzzleFlash"></div>

  <div id="touchOverlay">
    <div id="leftZone" class="touchZone">
      <div class="joystick">
        <div id="joystickKnob" class="joystickKnob"></div>
      </div>
    </div>

    <div id="rightZone" class="touchZone">
      <div id="reloadButton" class="action">Reload</div>
      <div id="shootButton" class="action">Tap<br>to Shoot</div>
    </div>
  </div>

  <div id="gameOver">
    <div class="gameOverCard">
      <div id="gameOverTitle">You Died</div>
      <div id="gameSummary">Wave: 1<br>Points: 0<br>Zombies Killed: 0</div>
      <div id="restartPrompt">Tap to Restart</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ============================================================
    // ZOMBIE BUNKER MOBILE - WITH AUDIO & FIXED VISIBILITY
    // ============================================================

    // Web Audio Context for sound effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(frequency, duration, type = 'sine', volume = 0.3) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = type;
        osc.frequency.value = frequency;

        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Audio context not available
      }
    }

    function playGunshot() {
      playSound(150, 0.1, 'square', 0.5);
      playSound(200, 0.08, 'sawtooth', 0.3);
    }

    function playReload() {
      playSound(300, 0.15, 'sine', 0.2);
      setTimeout(() => playSound(400, 0.1, 'sine', 0.2), 150);
    }

    function playZombieMoan() {
      playSound(80 + Math.random() * 40, 0.3, 'sine', 0.25);
    }

    function playZombieHit() {
      playSound(120, 0.05, 'square', 0.4);
    }

    // ============================================================
    // THREE.JS SCENE SETUP
    // ============================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1f26);
    scene.fog = new THREE.FogExp2(0x1a1f26, 0.035);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 350);
    camera.rotation.order = "YXZ";
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      powerPreference: "high-performance",
      precision: "lowp"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = false;
    document.body.appendChild(renderer.domElement);

    // ENHANCED LIGHTING - brighter for visibility
    const ambientLight = new THREE.AmbientLight(0x8899bb, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xccddff, 0.9);
    dirLight.position.set(-15, 25, 15);
    scene.add(dirLight);

    const flashlight = new THREE.PointLight(0xffffcc, 2.0, 40, 1.5);
    flashlight.position.set(0, 0.75, 0);
    camera.add(flashlight);

    // Add hemisphere light for more ambient fill
    const hemiLight = new THREE.HemisphereLight(0x4488ff, 0x220011, 0.7);
    scene.add(hemiLight);

    // ============================================================
    // Procedural textures & materials
    // ============================================================
    function makeCanvasTexture(baseColor, kind = "plain") {
      const canvas = document.createElement("canvas");
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (kind === "metal") {
        for (let i = 0; i < 64; i += 2) {
          ctx.strokeStyle = "rgba(255,255,255," + (0.04 + Math.random() * 0.15) + ")";
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, 64);
          ctx.stroke();
        }
      } else if (kind === "grit") {
        for (let j = 0; j < 200; j++) {
          ctx.fillStyle = "rgba(0,0,0," + (0.1 + Math.random() * 0.2) + ")";
          ctx.fillRect(Math.random() * 64, Math.random() * 64, 2 + Math.random() * 3, 2 + Math.random() * 3);
        }
      } else if (kind === "stripes") {
        for (let i = 0; i < 64; i += 4) {
          ctx.fillStyle = (i % 8 === 0) ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.1)";
          ctx.fillRect(i, 0, 2, 64);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      return tex;
    }

    function mat(base, kind = "plain") {
      return new THREE.MeshPhongMaterial({
        map: makeCanvasTexture(base, kind),
        shininess: 30,
        transparent: false
      });
    }

    // ============================================================
    // Weapon model
    // ============================================================
    function createWeaponModel() {
      const group = new THREE.Group();

      const metal = mat("#3d4149", "metal");
      const dark = mat("#252933", "stripes");
      const accent = mat("#8a9aaa", "metal");

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.18, 0.14), metal);
      body.position.set(0.2, -0.06, 0);
      group.add(body);

      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.92, 8), metal);
      barrel.rotation.z = Math.PI / 2;
      barrel.position.set(0.72, -0.06, 0);
      group.add(barrel);

      const stock = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.12, 0.12), dark);
      stock.position.set(-0.3, -0.06, 0);
      group.add(stock);

      const mag = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.28, 0.12), accent);
      mag.position.set(0.12, -0.23, 0);
      group.add(mag);

      const frontSight = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.16, 0.08), accent);
      frontSight.position.set(0.92, 0.12, 0);
      group.add(frontSight);

      const rearSight = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 0.08), accent);
      rearSight.position.set(0.08, 0.16, 0);
      group.add(rearSight);

      group.rotation.y = -0.15;
      group.scale.set(1.15, 1.15, 1.15);
      group.userData = {
        basePos: { x: 0.58, y: -0.42, z: -0.42 },
        recoilAmount: 0,
        recoilDecay: 0
      };
      return group;
    }

    // ============================================================
    // Zombie model - BRIGHTER COLORS FOR VISIBILITY
    // ============================================================
    function createZombieModel() {
      const group = new THREE.Group();

      const skin = mat("#775555", "grit");
      const dark = mat("#553333", "grit");
      const eyeMat = mat("#ffff99", "metal");

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.8, 0.28), skin);
      torso.position.set(0, 0.7, 0);
      torso.userData.joint = "torso";
      group.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.42, 0.36), skin);
      head.position.set(0, 1.46, 0);
      head.userData.joint = "head";
      group.add(head);

      const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.72, 0.14), dark);
      leftArm.position.set(-0.4, 0.88, 0);
      leftArm.rotation.z = 0.58;
      leftArm.userData.joint = "leftArm";
      group.add(leftArm);

      const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.72, 0.14), dark);
      rightArm.position.set(0.4, 0.88, 0);
      rightArm.rotation.z = -0.58;
      rightArm.userData.joint = "rightArm";
      group.add(rightArm);

      const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.9, 0.18), dark);
      leftLeg.position.set(-0.12, 0.12, 0);
      leftLeg.userData.joint = "leftLeg";
      group.add(leftLeg);

      const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.9, 0.18), dark);
      rightLeg.position.set(0.12, 0.12, 0);
      rightLeg.userData.joint = "rightLeg";
      group.add(rightLeg);

      const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.04), eyeMat);
      eyeL.position.set(-0.09, 1.5, 0.2);
      group.add(eyeL);

      const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.04), eyeMat);
      eyeR.position.set(0.09, 1.5, 0.2);
      group.add(eyeR);

      group.scale.setScalar(0.9);
      group.userData = {
        armSwing: 0,
        legSwing: 0
      };
      return group;
    }

    // ============================================================
    // Map
    // ============================================================
    const map = {
      size: 80,
      floorY: -1.2,
      wallMaterial: mat("#3a4551", "grit")
    };

    function buildMap() {
      const floor = new THREE.Mesh(
        new THREE.BoxGeometry(map.size, 1.6, map.size),
        mat("#2a3238", "grit")
      );
      floor.position.y = map.floorY;
      scene.add(floor);

      const walls = [
        { pos: [0, 4.2, -map.size / 2], size: [map.size, 8, 2] },
        { pos: [0, 4.2, map.size / 2], size: [map.size, 8, 2] },
        { pos: [-map.size / 2, 4.2, 0], size: [2, 8, map.size] },
        { pos: [map.size / 2, 4.2, 0], size: [2, 8, map.size] },

        { pos: [-13, 2.7, 0], size: [2.5, 5.4, 26] },
        { pos: [13, 2.7, 0], size: [2.5, 5.4, 26] },
        { pos: [0, 2.7, -15], size: [30, 5.4, 2.5] },
        { pos: [0, 2.7, 15], size: [30, 5.4, 2.5] }
      ];

      for (const wall of walls) {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(wall.size[0], wall.size[1], wall.size[2]),
          map.wallMaterial
        );
        mesh.position.set(wall.pos[0], wall.pos[1], wall.pos[2]);
        mesh.userData.isWall = true;
        scene.add(mesh);
      }

      const props = [
        [-8, 0.9, -8], [8, 0.9, 8], [-12, 0.9, 12], [15, 0.9, -10],
        [0, 0.9, -22], [0, 0.9, 22], [-22, 0.9, 0], [22, 0.9, 0]
      ];
      props.forEach(([x, y, z], i) => {
        const crate = new THREE.Mesh(
          new THREE.BoxGeometry(2.2, 2.2, 2.2),
          mat(i % 2 === 0 ? "#4a5560" : "#3a4450", "grit")
        );
        crate.position.set(x, y, z);
        scene.add(crate);
      });
    }
    buildMap();

    // ============================================================
    // Player - SPAWN IN CENTER WITH ROOM TO MOVE
    // ============================================================
    const player = {
      position: new THREE.Vector3(0, 0, 0),
      velocity: new THREE.Vector3(),
      radius: 0.55,
      speed: 5.4,
      weapon: createWeaponModel(),
      bobPhase: 0,
      recoilKickback: 0,
      recoilRotation: 0
    };

    player.weapon.position.set(0.58, -0.42, -0.42);
    camera.add(player.weapon);

    // ============================================================
    // Game state
    // ============================================================
    const state = {
      wave: 1,
      health: 100,
      ammo: 30,
      reserveAmmo: 120,
      points: 0,
      zombiesKilled: 0,
      gameOver: false,
      reloadTimer: 0,
      lastShotAt: 0,
      shotCooldownMs: 140,
      activeZombieCount: 0
    };

    const hudRefs = {
      wave: document.getElementById("waveValue"),
      health: document.getElementById("healthValue"),
      ammo: document.getElementById("ammoValue"),
      points: document.getElementById("pointsValue"),
      zombieCount: document.getElementById("zombieValue"),
      gameOver: document.getElementById("gameOver"),
      summary: document.getElementById("gameSummary"),
      muzzleFlash: document.getElementById("muzzleFlash")
    };

    function updateHud() {
      hudRefs.wave.textContent = state.wave;
      hudRefs.health.textContent = Math.max(0, Math.ceil(state.health));
      hudRefs.ammo.textContent = state.ammo + " / " + state.reserveAmmo;
      hudRefs.points.textContent = state.points;
      hudRefs.zombieCount.textContent = state.activeZombieCount;
    }

    // ============================================================
    // Object pooling
    // ============================================================
    class Pool {
      constructor(factory, initialSize) {
        this.factory = factory;
        this.free = [];
        this.used = new Set();

        for (let i = 0; i < initialSize; i++) {
          const item = factory();
          this.free.push(item);
        }
      }

      acquire() {
        let item = this.free.pop();
        if (!item) item = this.factory();
        this.used.add(item);
        return item;
      }

      release(item) {
        if (!item) return;
        this.used.delete(item);
        if (this.free.indexOf(item) === -1) {
          this.free.push(item);
        }
      }

      clear() {
        for (const item of this.free) this.disposeItem(item);
        for (const item of this.used) this.disposeItem(item);
        this.free = [];
        this.used.clear();
      }

      disposeItem(item) {
        if (!item) return;

        if (item.mesh) {
          if (item.mesh.parent) item.mesh.parent.remove(item.mesh);
          item.mesh.traverse((child) => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
              if (Array.isArray(child.material)) {
                child.material.forEach((m) => m.dispose());
              } else {
                child.material.dispose();
              }
            }
          });
        }

        if (item.geometry) item.geometry.dispose();
        if (item.material) {
          if (Array.isArray(item.material)) {
            item.material.forEach((m) => m.dispose());
          } else {
            item.material.dispose();
          }
        }
      }
    }

    function bulletFactory() {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.11, 6, 6),
        mat("#ffff00", "metal")
      );
      mesh.userData = {
        active: false,
        direction: new THREE.Vector3(),
        life: 0
      };
      return mesh;
    }

    function zombieFactory() {
      const obj = {
        mesh: createZombieModel(),
        active: false,
        hp: 20,
        speed: 0.9,
        pos: new THREE.Vector3(),
        vel: new THREE.Vector3(),
        phase: 0,
        time: 0
      };
      scene.add(obj.mesh);
      obj.mesh.visible = false;
      return obj;
    }

    const bulletPool = new Pool(bulletFactory, 140);
    const zombiePool = new Pool(zombieFactory, 70);

    const bullets = [];
    const zombies = [];

    // ============================================================
    // Zombie lifecycle
    // ============================================================
    function activateZombie(zombie, pos, wave) {
      zombie.active = true;
      zombie.hp = 18 + wave * 12;
      zombie.speed = 0.45 + wave * 0.085 + Math.random() * 0.14;
      zombie.pos.copy(pos);
      zombie.mesh.position.copy(pos);
      zombie.mesh.visible = true;
      zombie.phase = Math.random() * Math.PI * 2;
      zombie.time = 0;
      state.activeZombieCount++;

      // Play zombie moan when spawned
      setTimeout(() => playZombieMoan(), Math.random() * 500);
    }

    function deactivateZombie(zombie) {
      if (!zombie) return;
      zombie.active = false;
      zombie.mesh.visible = false;
      zombie.mesh.position.set(9999, 9999, 9999);
      zombiePool.release(zombie);
      state.activeZombieCount = Math.max(0, state.activeZombieCount - 1);
    }

    function spawnWave(wave) {
      const count = 5 + wave * 2;
      for (let i = 0; i < count; i++) {
        let zombie = zombiePool.acquire();
        zCheck: if (!zombie) continue zCheck;
        zombies.push(zombie);

        const angle = Math.random() * Math.PI * 2;
        const radius = 30 + Math.random() * 20;
        const spawn = new THREE.Vector3(
          Math.cos(angle) * radius,
          0.35,
          Math.sin(angle) * radius
        );
        activateZombie(zombie, spawn, wave);
      }
    }

    function waveCheck() {
      const remaining = zombies.filter((z) => z.active).length;
      if (remaining === 0) {
        state.wave += 1;
        spawnWave(state.wave);
        updateHud();
      }
    }

    // ============================================================
    // Muzzle flash
    // ============================================================
    function triggerMuzzleFlash() {
      const flash = hudRefs.muzzleFlash;
      flash.classList.remove("burst");
      void flash.offsetWidth;
      flash.classList.add("burst");
    }

    // ============================================================
    // Shooting
    // ============================================================
    function fireBullet() {
      if (state.gameOver) return;
      if (state.reloadTimer > 0) return;
      if (state.ammo <= 0) {
        reloadWeapon();
        return;
      }

      const now = performance.now();
      if (now - state.lastShotAt < state.shotCooldownMs) return;

      state.lastShotAt = now;
      state.ammo -= 1;

      player.recoilKickback = 0.12;
      player.recoilRotation = (Math.random() - 0.5) * 0.08;

      triggerMuzzleFlash();
      playGunshot();

      const shotOrigin = camera.position.clone();
      const dir = camera.getWorldDirection(new THREE.Vector3());

      const bullet = bulletPool.acquire();
      bullet.position.copy(shotOrigin);
      bullet.userData.active = true;
      bullet.userData.direction.copy(dir);
      bullet.userData.life = 48;

      scene.add(bullet);
      bullets.push(bullet);

      updateHud();
    }

    function updateBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        if (!bullet.userData.active) {
          scene.remove(bullet);
          bulletPool.release(bullet);
          bullets.splice(i, 1);
          continue;
        }

        bullet.position.addScaledVector(bullet.userData.direction, 0.95);
        bullet.userData.life -= 1;

        let hit = false;
        for (const zombie of zombies) {
          if (!zombie.active) continue;
          const d = bullet.position.distanceTo(zombie.mesh.position);
          if (d < 0.9) {
            zombie.hp -= 18;
            playZombieHit();
            if (zombie.hp <= 0) {
              state.points += 100;
              state.zombiesKilled += 1;
              deactivateZombie(zombie);
              waveCheck();
            }
            hit = true;
            break;
          }
        }

        if (hit || bullet.userData.life <= 0) {
          bullet.userData.active = false;
          scene.remove(bullet);
          bulletPool.release(bullet);
          bullets.splice(i, 1);
        }
      }
    }

    // ============================================================
    // Reload
    // ============================================================
    function reloadWeapon() {
      if (state.gameOver) return;
      if (state.reloadTimer > 0) return;
      if (state.reserveAmmo <= 0 || state.ammo === 30) return;

      state.reloadTimer = 700;
      playReload();
    }

    function finishReload() {
      const needed = 30 - state.ammo;
      const taken = Math.min(needed, state.reserveAmmo);
      state.ammo += taken;
      state.reserveAmmo -= taken;
      state.reloadTimer = 0;
      updateHud();
    }

    // ============================================================
    // Collision
    // ============================================================
    function resolveWorldBounds(pos) {
      const max = map.size * 0.5 - 1.4;
      pos.x = THREE.MathUtils.clamp(pos.x, -max, max);
      pos.z = THREE.MathUtils.clamp(pos.z, -max, max);
    }

    function resolvePlayerWallCollision(pos) {
      const walls = scene.children.filter((obj) => obj.userData && obj.userData.isWall);

      for (const wall of walls) {
        const box = new THREE.Box3().setFromObject(wall);
        const playerAABB = new THREE.Box3(
          new THREE.Vector3(pos.x - player.radius, -0.5, pos.z - player.radius),
          new THREE.Vector3(pos.x + player.radius, 1.8, pos.z + player.radius)
        );

        if (playerAABB.intersectsBox(box)) {
          const wallMin = box.min;
          const wallMax = box.max;

          const dx = Math.min(Math.abs(pos.x - wallMin.x), Math.abs(wallMax.x - pos.x));
          const dz = Math.min(Math.abs(pos.z - wallMin.z), Math.abs(wallMax.z - pos.z));

          if (dx < dz) {
            pos.x = pos.x < wall.position.x ? wallMin.x - player.radius - 0.05 : wallMax.x + player.radius + 0.05;
          } else {
            pos.z = pos.z < wall.position.z ? wallMin.z - player.radius - 0.05 : wallMax.z + player.radius + 0.05;
          }
        }
      }
    }

    // ============================================================
    // Player update
    // ============================================================
    function updatePlayer(dt) {
      if (state.gameOver) return;

      const yaw = input.lookYaw;
      const facing = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const strafe = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

      const move = new THREE.Vector3();
      move.addScaledVector(facing, input.moveY);
      move.addScaledVector(strafe, input.moveX);

      if (move.lengthSq() > 0) move.normalize();

      const speedScale = (move.lengthSq() > 0) ? 1 : 0;
      player.velocity.copy(move).multiplyScalar(player.speed * speedScale * dt * 60);

      player.position.add(player.velocity);
      resolvePlayerWallCollision(player.position);
      resolveWorldBounds(player.position);

      camera.position.set(player.position.x, 1.35, player.position.z);
      camera.rotation.y = input.lookYaw;
      camera.rotation.x = input.lookPitch;
      camera.rotation.z = 0;

      player.recoilKickback *= 0.88;
      player.recoilRotation *= 0.90;

      player.bobPhase += dt * (move.lengthSq() > 0 ? 15 : 8);
      const bob = move.lengthSq() > 0 ? Math.sin(player.bobPhase) * 0.06 : 0.0;

      player.weapon.position.x = 0.58;
      player.weapon.position.y = -0.42 + bob - player.recoilKickback;
      player.weapon.position.z = -0.42;
      player.weapon.rotation.x = player.recoilRotation;
    }

    // ============================================================
    // Zombie AI + animation
    // ============================================================
    function updateZombies() {
      for (const zombie of zombies) {
        if (!zombie.active) continue;

        zombie.time += 1 / 60;

        const toPlayer = new THREE.Vector3().subVectors(player.position, zombie.pos);
        const dist = toPlayer.length();

        if (dist > 0.001) {
          toPlayer.normalize();
          zombie.vel.copy(toPlayer).multiplyScalar(zombie.speed);
          zombie.pos.addScaledVector(zombie.vel, 1);
          zombie.mesh.position.copy(zombie.pos);

          zombie.mesh.lookAt(player.position.x, zombie.pos.y + 0.9, player.position.z);
          zombie.mesh.rotation.x = 0;
          zombie.mesh.rotation.z = 0;

          zombie.mesh.position.y = 0.35 + Math.sin(performance.now() * 0.008 + zombie.phase) * 0.08;

          const armSwing = Math.sin(zombie.time * 8) * 0.35;
          zombie.mesh.userData.armSwing = armSwing;

          const legSwing = Math.sin(zombie.time * 8 + Math.PI) * 0.2;
          zombie.mesh.userData.legSwing = legSwing;

          zombie.mesh.children.forEach((child) => {
            if (child.userData.joint === "leftArm") {
              child.rotation.z = 0.58 + armSwing;
            } else if (child.userData.joint === "rightArm") {
              child.rotation.z = -0.58 - armSwing;
            } else if (child.userData.joint === "leftLeg") {
              child.rotation.x = legSwing;
            } else if (child.userData.joint === "rightLeg") {
              child.rotation.x = -legSwing;
            }
          });
        }

        if (dist < 1.12) {
          state.health -= 0.32;
          if (state.health <= 0) {
            state.health = 0;
            endGame();
          }
          updateHud();
        }
      }
    }

    // ============================================================
    // Game over
    // ============================================================
    function endGame() {
      state.gameOver = true;
      hudRefs.summary.innerHTML =
        "Wave: " + state.wave + "<br>" +
        "Points: " + state.points + "<br>" +
        "Zombies Killed: " + state.zombiesKilled;
      hudRefs.gameOver.classList.add("show");
    }

    function resetGame() {
      state.wave = 1;
      state.health = 100;
      state.ammo = 30;
      state.reserveAmmo = 120;
      state.points = 0;
      state.zombiesKilled = 0;
      state.gameOver = false;
      state.reloadTimer = 0;
      state.lastShotAt = 0;

      for (const bullet of bullets) {
        if (bullet.parent) bullet.parent.remove(bullet);
        bullet.userData.active = false;
        bulletPool.release(bullet);
      }
      bullets.length = 0;

      for (const zombie of zombies) {
        if (zombie && zombie.active) {
          zombie.mesh.visible = false;
          zombie.active = false;
        }
        zombiePool.release(zombie);
      }
      zombies.length = 0;

      // Player spawn in center of map
      player.position.set(0, 0, 0);
      camera.position.set(0, 1.35, 0);
      input.lookYaw = 0;
      input.lookPitch = 0;
      input.moveX = 0;
      input.moveY = 0;
      input.shooting = false;

      hudRefs.gameOver.classList.remove("show");
      updateHud();
      spawnWave(state.wave);
    }

    // ============================================================
    // Input system
    // ============================================================
    const input = {
      moveX: 0,
      moveY: 0,
      lookYaw: 0,
      lookPitch: 0,
      shooting: false,
      joyPointerId: null,
      lookPointerId: null,
      lastLookX: 0,
      lastLookY: 0
    };

    const leftZone = document.getElementById("leftZone");
    const rightZone = document.getElementById("rightZone");
    const joystickKnob = document.getElementById("joystickKnob");
    const shootButton = document.getElementById("shootButton");
    const reloadButton = document.getElementById("reloadButton");
    const gameOverEl = document.getElementById("gameOver");

    function clampPitch(v) {
      return THREE.MathUtils.clamp(v, -1.35, 1.35);
    }

    function updateJoystickVisual(dx, dy, max) {
      const ang = Math.atan2(dy, dx);
      const dist = Math.min(Math.hypot(dx, dy), max);
      const x = Math.cos(ang) * dist;
      const y = Math.sin(ang) * dist;
      joystickKnob.style.transform = "translate(" + x + "px, " + y + "px)";
    }

    function handleJoystickTouch(touch) {
      const rect = leftZone.getBoundingClientRect();
      const cx = rect.left + rect.width * 0.5;
      const cy = rect.top + rect.height * 0.5;
      const dx = touch.clientX - cx;
      const dy = touch.clientY - cy;
      const max = 46;

      const dist = Math.min(Math.hypot(dx, dy), max);
      const ang = Math.atan2(dy, dx);

      const nx = Math.cos(ang) * dist;
      const ny = Math.sin(ang) * dist;

      updateJoystickVisual(nx, ny, max);

      input.moveX = Math.cos(ang) * (dist / max);
      input.moveY = Math.sin(ang) * (dist / max);
    }

    leftZone.addEventListener("touchstart", (event) => {
      if (!event.touches || !event.touches.length) return;
      const touch = event.touches[0];
      input.joyPointerId = touch.identifier;
      handleJoystickTouch(touch);
    }, { passive: false });

    leftZone.addEventListener("touchmove", (event) => {
      for (const touch of event.touches) {
        if (touch.identifier === input.joyPointerId) {
          handleJoystickTouch(touch);
          break;
        }
      }
    }, { passive: false });

    leftZone.addEventListener("touchend", () => {
      input.joyPointerId = null;
      input.moveX = 0;
      input.moveY = 0;
      joystickKnob.style.transform = "translate(0px, 0px)";
    }, { passive: false });

    leftZone.addEventListener("touchcancel", () => {
      input.joyPointerId = null;
      input.moveX = 0;
      input.moveY = 0;
      joystickKnob.style.transform = "translate(0px, 0px)";
    }, { passive: false });

    function handleLookTouch(touch) {
      const dx = touch.clientX - input.lastLookX;
      const dy = touch.clientY - input.lastLookY;

      input.lookYaw -= dx * 0.0048;
      input.lookPitch = clampPitch(input.lookPitch - dy * 0.0035);

      input.lastLookX = touch.clientX;
      input.lastLookY = touch.clientY;
    }

    rightZone.addEventListener("touchstart", (event) => {
      if (!event.touches || !event.touches.length) return;
      const touch = event.touches[0];
      if (touch.clientX > window.innerWidth * 0.5 &&
          (touch.clientY < window.innerHeight - 130 || touch.clientX < window.innerWidth - 160)) {
        input.lookPointerId = touch.identifier;
        input.lastLookX = touch.clientX;
        input.lastLookY = touch.clientY;
      }
    }, { passive: false });

    rightZone.addEventListener("touchmove", (event) => {
      for (const touch of event.touches) {
        if (touch.identifier === input.lookPointerId) {
          handleLookTouch(touch);
          break;
        }
      }
    }, { passive: false });

    rightZone.addEventListener("touchend", () => {
      input.lookPointerId = null;
    }, { passive: false });

    rightZone.addEventListener("touchcancel", () => {
      input.lookPointerId = null;
    }, { passive: false });

    shootButton.addEventListener("touchstart", (event) => {
      event.preventDefault();
      input.shooting = true;
    }, { passive: false });

    shootButton.addEventListener("touchend", (event) => {
      event.preventDefault();
      input.shooting = false;
    }, { passive: false });

    shootButton.addEventListener("touchcancel", (event) => {
      event.preventDefault();
      input.shooting = false;
    }, { passive: false });

    reloadButton.addEventListener("touchstart", (event) => {
      event.preventDefault();
      reloadWeapon();
    }, { passive: false });

    gameOverEl.addEventListener("click", () => {
      if (state.gameOver) {
        resetGame();
      }
    });

    // ============================================================
    // Main loop
    // ============================================================
    function updateGame(dt) {
      if (state.reloadTimer > 0) {
        state.reloadTimer -= dt * 1000;
        if (state.reloadTimer <= 0) finishReload();
      }

      if (input.shooting) fireBullet();

      updateBullets();
      updateZombies();
      updateHud();
    }

    let lastTime = performance.now();

    function animate(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.032);
      lastTime = now;

      updatePlayer(dt);
      updateGame(dt);

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", onResize, false);

    // Start
    resetGame();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
